[package]
name = "chromiator"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Artist-directed perceptual color partitioning and remapping for GNOME"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
exr = "1.74"
gdk-pixbuf = "0.21"
gio = "0.21"
glib = "0.21"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
image = { version = "0.25", default-features = false, features = ["bmp", "exr", "gif", "jpeg", "png", "tiff", "webp"] }
moxcms = "0.8.1"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.20"
thiserror = "2.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
